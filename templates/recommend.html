<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Book Recommender System</title>
    <!-- Latest compiled and minified CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css"
        integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
</head>
<style>
    .text-white {
        color: white
    }

    .card-img-top {
        max-width: 100%;
        height: 300px;
        object-fit: cover;
    }

    .navbar-brand,
    .navbar .nav li a {
        color: white !important;
    }

    .navbar .nav li a:hover {
        color: #f0f0f0 !important;
    }
</style>

<body style="background-color:black">

    <nav class="navbar" style="background-color:#00a65a">
        <a class="navbar-brand">My Book recommender</a>
        <ul class="nav navbar-nav">
            <li><a href="/">Home</a></li>
            <li><a href="/recommend">Recommend</a></li>
            <li><a>Contact</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h1 class="text-white" style="font-size:50px">Recommend Books</h1>
                <form action="/recommend_books" method="post">
                    <input name="user_input" type="text" class="form-control"
                        placeholder="Enter book title (e.g., 1984)" required><br>
                    <input type="submit" class="btn btn-lg btn-warning" value="Get Recommendations">
                </form>
            </div>



            {% if data %}

            {% for i in data %}
            <div class="col-md-3" style="margin-top:50px">
                <div class="card">
                    <div class="card-body">
                        <img class="card-img-top" src="{{i[2]}}" alt="{{i[0]}}"
                            onerror="this.src='https://via.placeholder.com/300x400?text=No+Image'">
                        <p class="text-white"><strong>{{i[0]}}</strong></p>
                        <h4 class="text-white">{{i[1]}}</h4>
                        {% if i[3] != 'N/A' %}
                        <div style="margin-top:10px; padding:10px; background-color:rgba(0,166,90,0.2); border-radius:5px;">
                            <p class="text-white" style="margin:5px 0;"><span style="color:#5cb85c;">✓</span> Positive: <strong>{{i[3]}}%</strong></p>
                            <p class="text-white" style="margin:5px 0;"><span style="color:#d9534f;">✗</span> Negative: <strong>{{i[4]}}%</strong></p>
                        </div>
                        {% else %}
                        <p class="text-white" style="margin-top:10px; font-size:12px;">Sentiment data not available</p>
                        {% endif %}
                    </div>
                </div>
            </div>
            {% endfor %}

            {% endif %}




        </div>
    </div>

</body>

</html>
